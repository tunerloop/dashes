name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/pack.test.mjs tools/preview.test.mjs tools/update-base.test.mjs
      - run: node tools/pack.mjs --check
